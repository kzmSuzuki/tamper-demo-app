<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https: http://127.0.0.1:8787; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>みんなの特別授業への期待</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/board.js"></script>
</head>
<body>
  <header class="site-header"><div class="shell"><a id="student-link" class="brand" href="./">特別授業への期待</a></div></header>
  <main class="shell board">
    <div class="board-heading">
      <div>
        <h1>みんなの特別授業への期待</h1>
        <p id="room-title" class="intro" hidden></p>
      </div>
      <div id="controls" class="row" hidden>
        <button id="refresh" type="button" class="secondary">今すぐ更新</button>
        <button id="toggle" type="button" class="secondary">自動更新を停止</button>
      </div>
    </div>
    <form id="join" class="panel" hidden>
      <label for="code">ルームコード</label>
      <div class="row join-action"><input id="code" name="room" maxlength="24" required autocomplete="off" autocapitalize="characters"><button>掲示板を開く</button></div>
    </form>
    <p id="room-state" class="room-state" hidden></p>
    <p id="status" class="status" role="status"></p>
    <p id="copy-status" role="status" class="status"></p>
    <div id="posts" class="grid"></div>
  </main>
</body>
</html>
